---
name: "build-image"

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      hub-version:
        description: "k8s-hub image tag to build on top of (must match the jupyterhub chart in use)"
        type: string
        required: false
        default: "4.3.2"
      push:
        description: "Push the image to Docker Hub"
        type: boolean
        required: false
        default: false

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/gersonrs/jupyterhub-hub
  # Keep in sync with the jupyterhub chart version of
  # modern-gitops-stack-module-jupyterhub. The hub image must match the chart.
  HUB_VERSION: "4.3.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve hub version
        id: hub
        env:
          INPUT_HUB_VERSION: ${{ inputs.hub-version }}
        run: |
          version="${INPUT_HUB_VERSION:-$HUB_VERSION}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # A pull request or a dry-run dispatch only verifies that the image builds
      # and that the templates land where the hub expects them.
      - name: Build for verification
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.push)
        run: |
          docker build \
            --build-arg HUB_VERSION=${{ steps.hub.outputs.version }} \
            --tag "${IMAGE_NAME}:verify" \
            .

      - name: Smoke test the baked layout
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.push)
        run: |
          docker run --rm --entrypoint sh "${IMAGE_NAME}:verify" -c '
            set -eu
            test -d /usr/local/share/jupyterhub/custom_templates
            test -f /usr/local/share/jupyterhub/custom_spawner_templates/form.html
            test -d /usr/local/share/jupyterhub/static/extra_assets
            test ! -e /usr/local/share/jupyterhub/custom_templates/spawn.html
            test "$(id -u)" = "1000"
            echo "baked layout OK"
          '

      - name: Set up QEMU
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # `latest` and `hub-<version>` are moving tags that follow main, so a
          # template change reaches a deploy that tracks them. Use `sha-*` or a
          # `v*` release tag when a deployment must stay reproducible.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=hub-${{ steps.hub.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            HUB_VERSION=${{ steps.hub.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max